<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFT DAO Validator</title>
  <style>
    /* Menyembunyikan form Pengaturan API & Supabase */
    #settings-panel {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>NFT DAO Validator</h2>
    <p>Standar 4K, Security Filter, Min Skor 80 & Storage Auto-Sync</p>

    <!-- Form Pengaturan disembunyikan -->
    <div id="settings-panel">
      <input type="password" id="gemini-key" placeholder="Gemini API Key">
      <input type="text" id="supabase-url" placeholder="Supabase URL">
      <input type="password" id="supabase-key" placeholder="Supabase Anon Key">
    </div>

    <!-- Form Input NFT Utama -->
    <div class="upload-section">
      <label>Unggah Gambar NFT / Screenshot Karya:</label>
      <input type="file" id="nft-file" accept="image/*">

      <label>Deskripsi / Lore (Max 130 Karakter):</label>
      <textarea id="nft-lore" maxlength="130" placeholder="Tuliskan deskripsi/lore aset..."></textarea>

      <button id="btn-evaluasi" onclick="evaluasiNFT()">Evaluasi & Kurasi NFT</button>
    </div>

    <!-- Log Riwayat Audit -->
    <div class="audit-log">
      <h3>Log Riwayat Audit DAO</h3>
      <table id="log-table">
        <thead>
          <tr>
            <th>VISUAL</th>
            <th>STATUS</th>
            <th>LORE</th>
            <th>RESOLUSI</th>
            <th>LORE %</th>
          </tr>
        </thead>
        <tbody id="log-body">
          <!-- Data audit akan dimuat di sini -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Ambil konfigurasi dari Vercel Endpoint / Serverless API
    async function evaluasiNFT() {
      const btn = document.getElementById("btn-evaluasi");
      btn.innerText = "⏳ Menganalisis & Mengunggah Aset...";
      btn.disabled = true;

      try {
        // Contoh pemanggilan API backend Vercel yang membaca process.env.GEMINI_API_KEY
        const response = await fetch('/api/evaluate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            lore: document.getElementById('nft-lore').value,
            model: "gemini-1.5-flash" // Penggunaan model Gemini yang stabil & valid
          })
        });

        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.message || "Gagal melakukan evaluasi.");
        }

        alert("Evaluasi Berhasil!");
      } catch (err) {
        alert("Error Evaluasi: " + err.message);
      } finally {
        btn.innerText = "Evaluasi & Kurasi NFT";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
