<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFT DAO Validator</title>
  <style>
    #settings-panel { display: none !important; }
    .upload-box { margin: 20px 0; padding: 15px; border: 1px dashed #4a5568; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>NFT DAO Validator</h2>
    <p>Standar 4K, Security Filter, Min Skor 80 & Storage Auto-Sync</p>

    <div class="upload-box">
      <label><b>Unggah Screenshot Detail NFT (PiBox / On-chain Review):</b></label><br><br>
      <input type="file" id="nft-ss" accept="image/*">
    </div>

    <button id="btn-evaluasi" onclick="evaluasiNFT()">Evaluasi & Kurasi NFT</button>

    <div class="audit-log" style="margin-top: 20px;">
      <h3>Log Riwayat Audit DAO</h3>
      <table id="log-table" border="1" width="100%">
        <thead>
          <tr>
            <th>TITLE & ISSUER</th>
            <th>STATUS</th>
            <th>LORE / DESKRIPSI</th>
            <th>VISUAL SKOR</th>
            <th>LORE %</th>
          </tr>
        </thead>
        <tbody id="log-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function evaluasiNFT() {
      const fileInput = document.getElementById("nft-ss");
      const btn = document.getElementById("btn-evaluasi");

      if (!fileInput.files[0]) {
        alert("Silakan pilih file screenshot NFT terlebih dahulu!");
        return;
      }

      btn.innerText = "⏳ Membaca SS & Menganalisis Aset...";
      btn.disabled = true;

      // Konversi gambar ke Base64
      const reader = new FileReader();
      reader.readAsDataURL(fileInput.files[0]);
      reader.onload = async function () {
        const base64Image = reader.result.split(',')[1];

        try {
          const response = await fetch('/api/evaluate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ imageBase64: base64Image })
          });

          const data = await response.json();
          if (!response.ok) throw new Error(data.message || "Gagal evaluasi.");

          alert("Evaluasi Berhasil!");
          console.log("Hasil Audit:", data.data);
        } catch (err) {
          alert("Error: " + err.message);
        } finally {
          btn.innerText = "Evaluasi & Kurasi NFT";
          btn.disabled = false;
        }
      };
    }
  </script>
</body>
</html>
